name: Build Zely Ice Dragon Mod

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Allow Gradle to run
        run: chmod +x ./gradlew

      - name: Build mod
        run: ./gradlew build

      - name: Save mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Zely-Ice-Dragon-Mod
          path: build/libs/*.jar
