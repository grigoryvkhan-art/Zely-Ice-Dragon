
name: Build Zely Ice Dragon

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        working-directory: Zely_Ice_Dragon_Fabric_1.21.1_source (2)
        run: gradle build

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Zely-Ice-Dragon-Mod
          path: "Zely_Ice_Dragon_Fabric_1.21.1_source (2)/build/libs/*.jar"
          if-no-files-found: error

