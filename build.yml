

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find project files
        id: find-project
        shell: bash
        run: |
          echo "Looking for Gradle project files..."
          find . -maxdepth 7 -type f \( \
            -name settings.gradle -o \
            -name settings.gradle.kts -o \
            -name build.gradle -o \
            -name build.gradle.kts \
          \) -print
          PROJECT_DIR=$(find . -maxdepth 7 -type f \( \
            -name settings.gradle -o \
            -name settings.gradle.kts \
          \) -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find . -maxdepth 7 -type f \( \
              -name build.gradle -o \
              -name build.gradle.kts \
            \) -printf '%h\n' | head -n 1)
          fi
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No Gradle project files were found."
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Using project directory: $PROJECT_DIR"

      - name: Build mod
        working-directory: ${{ steps.find-project.outputs.project_dir }}
        run: gradle build

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Zely-Ice-Dragon-Mod
          path: "**/build/libs/*.jar"
          if-no-files-found: error
